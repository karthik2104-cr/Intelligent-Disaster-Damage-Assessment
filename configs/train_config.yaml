# Part 2 training defaults. Data paths, image size, seed and augmentation stay
# in configs/data_config.yaml so Part 1 is not duplicated.

seed: 42

dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001

scheduler:
  name: reduce_on_plateau
  factor: 0.5
  patience: 2
  min_lr: 0.000001

train:
  epochs: 8
  early_stopping_patience: 3
  # Validation metric used for early stopping and checkpointing. Test is never used.
  monitor: val_macro_f1
  monitor_mode: max
  amp: true
  grad_clip_norm: 1.0
  log_every: 50

loss:
  name: cross_entropy
  use_class_weights: true

paths:
  models: models
  experiments: reports/experiments

# Per-model overrides applied by scripts/train.py
models:
  baseline:
    batch_size: 128
    lr: 0.001
    epochs: 6
    early_stopping_patience: 3
  custom_cnn:
    batch_size: 32
    lr: 0.001
    epochs: 8
    early_stopping_patience: 3
  resnet50:
    batch_size: 16
    lr: 0.001
    epochs_head: 5
    epochs_finetune: 4
    finetune_lr: 0.0001
    weight_decay: 0.0001
    early_stopping_patience: 3
  efficientnet_b0:
    batch_size: 16
    lr: 0.001
    epochs_head: 5
    epochs_finetune: 4
    finetune_lr: 0.0001
    weight_decay: 0.0001
    early_stopping_patience: 3
